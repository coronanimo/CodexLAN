name: Feature request
description: Propose a scoped improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Affected boundary
      options:
        - Browser UI
        - Node service or API
        - Codex app-server compatibility
        - Windows launcher or deployment
        - Android shell
        - Documentation
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Security and compatibility impact
      description: Note permissions, data-format, network, or app-server implications.
