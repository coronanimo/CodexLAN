name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-check:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  android-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build and lint Android client
        working-directory: android
        run: .\gradlew.bat --no-daemon --console=plain clean assembleDebug lintDebug assembleRelease lintRelease
      - name: Verify ABI-independent APKs
        shell: pwsh
        run: |
          $version = (ConvertFrom-Json -InputObject (Get-Content -LiteralPath 'package.json' -Raw)).version
          $apks = @(
            Get-Item -LiteralPath ('android/app/build/outputs/apk/debug/CodexLAN-{0}-debug.apk' -f $version)
            Get-Item -LiteralPath ('android/app/build/outputs/apk/release/CodexLAN-{0}-release.apk' -f $version)
          )
          foreach ($apk in $apks) {
            $entries = @(& jar tf $apk.FullName)
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect APK: $($apk.FullName)" }
            $nativeLibraries = @($entries -match '^lib/[^/]+/.+\.so$')
            if ($nativeLibraries.Count -ne 0) {
              throw "Unexpected native libraries in ${apk}: $($nativeLibraries -join ', ')"
            }
            Write-Output "Verified ABI-independent APK: $($apk.Name)"
          }
