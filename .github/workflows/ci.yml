name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-check:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  android-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Build and lint Android client
        working-directory: android
        run: .\gradlew.bat --no-daemon --console=plain clean assembleDebug lintDebug assembleRelease lintRelease
      - name: Verify ABI-independent APKs
        shell: pwsh
        run: |
          $apks = @(
            Resolve-Path 'android/app/build/outputs/apk/debug/app-debug.apk'
            Resolve-Path 'android/app/build/outputs/apk/release/app-release-unsigned.apk'
          )
          foreach ($apk in $apks) {
            $nativeLibraries = @(& jar tf $apk | Where-Object { $_ -match '^lib/[^/]+/.+\.so$' })
            if ($nativeLibraries.Count -ne 0) {
              throw "Unexpected native libraries in ${apk}: $($nativeLibraries -join ', ')"
            }
            Get-FileHash -LiteralPath $apk -Algorithm SHA256
          }
